name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Create source release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            This release contains source code only.

            CC Desktop is an unofficial project and is not affiliated with Anthropic.
            Prebuilt installers are not attached because bundled third-party runtimes
            require separate redistribution review.
          generate_release_notes: true
