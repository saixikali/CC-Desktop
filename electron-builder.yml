appId: com.cc.desktop
productName: CC Desktop
copyright: Copyright (c) 2026 CC Desktop contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/@anthropic-ai/**"

extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"

npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CC Desktop
  deleteAppDataOnUninstall: false
  artifactName: CC-Desktop-${version}-x64-setup.exe

protocols:
  - name: CC Desktop
    schemes:
      - cc-desktop
